<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="25" y="15" width="900" height="50" rx="6" fill="#1e293b" />
  <text x="45" y="40" fill="#f8fafc" font-size="16" font-weight="700">Jira Sprint 1 Burndown Chart: Digital Gift Card &amp; Loyalty Point Exchange</text>
  <text x="45" y="55" fill="#94a3b8" font-size="11">Sprint 1 Duration: 5 Working Days | Committed Velocity: 15 Story Points</text>

  <!-- Chart Area -->
  <g transform="translate(80, 95)">
    <!-- Background grid -->
    <rect x="0" y="0" width="780" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Horizontal Gridlines & Y-Labels -->
    <!-- 15 pts -->
    <line x1="0" y1="0" x2="780" y2="0" stroke="#e2e8f0" stroke-width="1" />
    <text x="-12" y="5" fill="#64748b" font-size="11" text-anchor="end" font-weight="600">15</text>
    
    <!-- 12 pts -->
    <line x1="0" y1="68" x2="780" y2="68" stroke="#e2e8f0" stroke-width="1" />
    <text x="-12" y="73" fill="#64748b" font-size="11" text-anchor="end">12</text>
    
    <!-- 9 pts -->
    <line x1="0" y1="136" x2="780" y2="136" stroke="#e2e8f0" stroke-width="1" />
    <text x="-12" y="141" fill="#64748b" font-size="11" text-anchor="end">9</text>
    
    <!-- 6 pts -->
    <line x1="0" y1="204" x2="780" y2="204" stroke="#e2e8f0" stroke-width="1" />
    <text x="-12" y="209" fill="#64748b" font-size="11" text-anchor="end">6</text>
    
    <!-- 3 pts -->
    <line x1="0" y1="272" x2="780" y2="272" stroke="#e2e8f0" stroke-width="1" />
    <text x="-12" y="277" fill="#64748b" font-size="11" text-anchor="end">3</text>
    
    <!-- 0 pts -->
    <line x1="0" y1="340" x2="780" y2="340" stroke="#94a3b8" stroke-width="1.5" />
    <text x="-12" y="344" fill="#64748b" font-size="11" text-anchor="end" font-weight="600">0</text>

    <!-- Vertical Gridlines & X-Labels (Days) -->
    <!-- Day 0 (Sprint Start) -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="360" fill="#334155" font-size="11" text-anchor="middle" font-weight="600">Day 1 (Mon)</text>
    <text x="0" y="375" fill="#64748b" font-size="9.5" text-anchor="middle">Planning</text>

    <!-- Day 1 -->
    <line x1="195" y1="0" x2="195" y2="340" stroke="#e2e8f0" stroke-width="1" />
    <text x="195" y="360" fill="#334155" font-size="11" text-anchor="middle" font-weight="600">Day 2 (Tue)</text>
    <text x="195" y="375" fill="#64748b" font-size="9.5" text-anchor="middle">Story 1.2 Done</text>

    <!-- Day 2 -->
    <line x1="390" y1="0" x2="390" y2="340" stroke="#e2e8f0" stroke-width="1" />
    <text x="390" y="360" fill="#334155" font-size="11" text-anchor="middle" font-weight="600">Day 3 (Wed)</text>
    <text x="390" y="375" fill="#64748b" font-size="9.5" text-anchor="middle">Story 1.1 Done</text>

    <!-- Day 3 -->
    <line x1="585" y1="0" x2="585" y2="340" stroke="#e2e8f0" stroke-width="1" />
    <text x="585" y="360" fill="#334155" font-size="11" text-anchor="middle" font-weight="600">Day 4 (Thu)</text>
    <text x="585" y="375" fill="#64748b" font-size="9.5" text-anchor="middle">Story 2.1 Done</text>

    <!-- Day 4 -->
    <line x1="780" y1="0" x2="780" y2="340" stroke="#cbd5e1" stroke-width="1" />
    <text x="780" y="360" fill="#334155" font-size="11" text-anchor="middle" font-weight="600">Day 5 (Fri)</text>
    <text x="780" y="375" fill="#64748b" font-size="9.5" text-anchor="middle">Story 2.2 Done</text>

    <!-- Guideline: Linear Ideal Burndown (Grey dashed line) -->
    <line x1="0" y1="0" x2="780" y2="340" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Actual Burndown Line (Red solid step line) -->
    <!-- Day 1: 15 pts -->
    <!-- Day 2: Story 1.2 completed (-2 pts -> 13 pts) -->
    <!-- Day 3: Story 1.1 completed (-3 pts -> 10 pts) -->
    <!-- Day 4: Story 2.1 completed (-5 pts -> 5 pts) -->
    <!-- Day 5: Story 2.2 completed (-5 pts -> 0 pts) -->
    <polyline points="0,0 195,0 195,45 390,45 390,113 585,113 585,227 780,227 780,340" 
              fill="none" stroke="#dc2626" stroke-width="3.5" />

    <!-- Data Points (Circles on Red Line) -->
    <circle cx="0" cy="0" r="5" fill="#dc2626" />
    <circle cx="195" cy="45" r="5" fill="#dc2626" />
    <circle cx="390" cy="113" r="5" fill="#dc2626" />
    <circle cx="585" cy="227" r="5" fill="#dc2626" />
    <circle cx="780" cy="340" r="5" fill="#16a34a" />

    <!-- Value Callout Badges -->
    <text x="10" y="-10" fill="#b91c1c" font-size="10" font-weight="700">15 pts</text>
    <text x="205" y="40" fill="#b91c1c" font-size="10" font-weight="700">13 pts (-2)</text>
    <text x="400" y="108" fill="#b91c1c" font-size="10" font-weight="700">10 pts (-3)</text>
    <text x="595" y="222" fill="#b91c1c" font-size="10" font-weight="700">5 pts (-5)</text>
    <text x="750" y="330" fill="#15803d" font-size="11" font-weight="700">0 pts (Goal Met)</text>

    <!-- Axis Labels -->
    <text transform="rotate(-90)" x="-170" y="-45" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Story Points Remaining</text>
    <text x="390" y="405" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Sprint Timeline (Days)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 25)">
    <rect x="0" y="0" width="290" height="32" rx="4" fill="#334155" opacity="0.9" />
    <line x1="12" y1="16" x2="42" y2="16" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="48" y="20" fill="#e2e8f0" font-size="10.5">Ideal Guideline</text>

    <line x1="145" y1="16" x2="175" y2="16" stroke="#dc2626" stroke-width="3" />
    <text x="181" y="20" fill="#fca5a5" font-size="10.5" font-weight="700">Actual Burndown</text>
  </g>
</svg>
